<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
    <h2>회원가입 폼</h2>
    <form action="#" th:action="@{/user/register}" th:object="${userInfoDto}" method="post">
        <label for="userid">사용자 아이디:</label>
        <input type="text" id="userid" name="userid" th:field="*{userid}" required><br><br>
        
        <label for="userpwd">비밀번호:</label>
        <input type="password" id="userpwd" name="userpwd" th:field="*{userpwd}" required><br><br>
        
        <button type="submit">가입하기</button>
    </form>
</body>
</html>
